apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceaccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "gsa_name is required for Workload Identity" .Values.gsa_name | quote }}
