apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceaccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
  {{- if .Values.gsa_name }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gsa_name | quote }}
  {{- else if lookup "v1" "Namespace" "" "kube-system" }}
  {{- fail "gsa_name is required for Workload Identity" }}
  {{- end }}
